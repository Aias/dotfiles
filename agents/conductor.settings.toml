"$schema" = "https://conductor.build/schemas/settings.schema.json"
codex_provider = "default"

[git]
branch_prefix = "aias/"
branch_prefix_type = "none"

[models]
default = "codex:gpt-6-astra"
review = "fable-5-1"
review_fast_mode = false

[models.claude_code]
default_effort_level = "high"
review_effort_level = "xhigh"

[models.codex]
default_thinking_level = "high"
personality = "none"
review_thinking_level = "high"

[prompts]
code_review = "Never create github comments without explicit instruction from the user. Return your review only as text within the chat. Never change or modify the code, the PR, or any related document. Consider the review a read-only operation aside from the conversation with the user.\n\nUse the /change-review skill to deeply review the code along all axes we care about, even for small-seeming changes."
create_pr = "Invoke /pr-guidelines and /write before creating or updating PRs. Follow pr-guidelines for title and body."
rename_branch = "Name branches as trombley/rmrk-<id> for branches that have associated Linear issues. For branches without associated linear issues, name them as trombley/<branch-title> with a very short and descriptive title. If there is no associated Linear ticket, ask the user if we should create one.\n\nONLY RENAME BRANCHES if this is the first message and first session for a particular feature. If there have already been commits, do not re-rename a branch.\n\nDo not include `aias` as the branch prefix, it should be `trombley/*`, not `aias/trombley/*`."
resolve_merge_conflicts = "Read /conductor for the target branch. Inspect the changes on both sides and prefer a rebase when practical. Resolve conflicts from the source and history, and regenerate generated files with their canonical tools. Follow the current task's authorization and GLOBAL.md for Git operations, including pushing. Continue through authorized resolution and validation. Ask only when intent remains ambiguous or an action requires authorization."
